name: Build & Release

# ============================================================================
#  定期 + 手动触发：检测上游新版本 → 解包 → 加 lineage.updater.uri
#  → 替换 blu_spark 内核 → avbroot 重打包签名 → 发布 Releases + GitHub Pages
#
#  全程运行在【免费版 ubuntu-latest runner】上（只解包/改 build.prop/重打包，
#  不做完整 AOSP 源码构建，磁盘/内存需求远低于源码路线）。
# ============================================================================

on:
  schedule:
    # 每周日 02:00 UTC 自动检测（LineageOS husky nightly 节奏）
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      force:
        description: '强制构建（忽略「该版本已发布」检测）'
        type: boolean
        default: false
      upstream_version:
        description: '指定要打包的上游版本（如 20261120 / 24.0-20261120 / 24.0-20261120-NIGHTLY-husky；留空=最新）'
        type: string
        default: ''

permissions:
  contents: write      # 创建/上传 Release
  pages: write         # 部署 GitHub Pages（updates.json）
  id-token: write      # Pages 需要 OIDC 认证

concurrency:
  group: build-release
  cancel-in-progress: false

env:
  SIGNING_KEYS: ${{ secrets.SIGNING_KEYS }}
  KEY_PASSPHRASE: ${{ secrets.KEY_PASSPHRASE }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            curl unzip jq zip python3 e2fsprogs

      - name: 检测上游新版本
        id: check
        run: |
          bash scripts/00-check-upstream.sh
          SHOULD="$(cat .work/SHOULD_BUILD)"
          echo "should_build=$SHOULD" >> "$GITHUB_OUTPUT"
          {
            echo "### 上游检测结果"
            echo ""
            echo "- SHOULD_BUILD: \`$SHOULD\`"
            if [ -f .work/upstream.env ]; then
              grep -E '^(UPSTREAM_VERSION|OTA_FILENAME)=' .work/upstream.env || true
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          FORCE_BUILD: ${{ github.event.inputs.force || 'false' }}
          TARGET_VERSION: ${{ github.event.inputs.upstream_version }}
          GH_TOKEN: ${{ github.token }}

      - name: 下载 → 改 product → 重打包 → 签名 → 打包 → 发布
        if: steps.check.outputs.should_build == 'true'
        run: bash scripts/make_all.sh --skip-check
        env:
          GH_TOKEN: ${{ github.token }}

      - name: 配置 Pages
        if: steps.check.outputs.should_build == 'true'
        uses: actions/configure-pages@v5

      - name: 上传 updates.json 到 Pages
        if: steps.check.outputs.should_build == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .work/pages

      - name: 部署 Pages
        if: steps.check.outputs.should_build == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
